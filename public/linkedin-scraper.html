<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKEDIN DIRECT SCANNER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/global.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .split-layout { display: grid; grid-template-columns: 350px 1fr; gap: 30px; margin-top: 30px; }
        .search-panel { background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); height: fit-content; position: sticky; top: 20px;}
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        .job-card { 
            background: var(--bg-body); border: 1px solid var(--border); padding: 20px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 12px; transition: all 0.3s ease; position: relative;
        }
        .job-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .job-card.selected { border-color: var(--success); background: rgba(0, 255, 0, 0.05); }
        
        .job-checkbox { position: absolute; top: 15px; right: 15px; transform: scale(1.5); cursor: pointer; accent-color: var(--success); }
        
        .job-header { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; padding-right: 30px; }
        .company-logo { width: 55px; height: 55px; border-radius: 8px; object-fit: contain; background: white; padding: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        .meta-tag { font-size: 0.85rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px; }
        
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 20px; background: var(--bg-body); border: 1px solid var(--border); color: white; border-radius: 8px; transition: border 0.3s; }
        input[type="text"]:focus { border-color: var(--accent); outline: none; }
        label { display: block; margin-bottom: 8px; font-size: 0.95rem; color: var(--accent); font-weight: 600; }
        
        .btn-success { background: var(--success); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-success:hover { box-shadow: 0 0 15px var(--success); opacity: 0.9; }
        .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="app-header"></div>

    <div class="container">
        <h1 style="font-family: var(--font-header); display: flex; align-items: center; gap: 15px;">
            <i class="fab fa-linkedin" style="color: #0a66c2;"></i> LinkedIn Direct Scanner
        </h1>

        <div class="split-layout">
            
            <!-- CONTROLS -->
            <div class="search-panel">
                <label>Target Company</label>
                <!-- Datalist provides Autocomplete functionality from Database -->
                <input type="text" id="ln-company" list="company-list" placeholder="Start typing... e.g. Siemens">
                <datalist id="company-list"></datalist>
                
                <label>Target Location</label>
                <input type="text" id="ln-location" placeholder="e.g. Cairo">

                <button class="btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;" onclick="scrapeLinkedIn()">
                    <i class="fas fa-search"></i> SCAN JOBS
                </button>
            </div>

            <!-- RESULTS -->
            <div>
                <!-- Action Toolbar -->
                <div class="toolbar" id="action-toolbar" style="display: none;">
                    <div>
                        <input type="checkbox" id="selectAll" style="transform: scale(1.3); margin-right: 10px; cursor: pointer;" onclick="toggleSelectAll()">
                        <label for="selectAll" style="display: inline; color: white; cursor: pointer; margin: 0;">Select All (<span id="result-count">0</span>)</label>
                    </div>
                    <button class="btn-success" id="import-btn" onclick="importSelectedJobs()">
                        <i class="fas fa-database"></i> Add to Database
                    </button>
                </div>

                <div class="results-grid" id="results-area">
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted); border: 2px dashed var(--border); border-radius: 12px; background: var(--bg-card);">
                        <i class="fas fa-satellite-dish fa-3x" style="margin-bottom: 15px; opacity: 0.5;"></i><br>
                        Ready to scan. Enter a company name and city to retrieve verified listings.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script>
        // Store scraped jobs temporarily
        let currentJobs =[];

        // 1. Fetch Companies for Autocomplete Dropdown
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/admin/all-companies');
                const companies = await res.json();
                const datalist = document.getElementById('company-list');
                companies.forEach(company => {
                    const option = document.createElement('option');
                    option.value = company;
                    datalist.appendChild(option);
                });
            } catch (err) {
                console.error("Failed to load company list", err);
            }
        });

        // 2. Main Scraping Function
        async function scrapeLinkedIn() {
            const btn = document.querySelector('.btn-primary');
            const resultsArea = document.getElementById('results-area');
            const toolbar = document.getElementById('action-toolbar');
            
            const company = document.getElementById('ln-company').value;
            const location = document.getElementById('ln-location').value;

            if(!company || !location) {
                return Swal.fire('Missing Data', 'Please enter Company and Location', 'warning');
            }
            
            // Lock UI
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SCANNING...';
            btn.disabled = true;
            toolbar.style.display = 'none';
            resultsArea.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px;"><i class="fas fa-circle-notch fa-spin fa-2x text-accent"></i><br><br>Contacting LinkedIn servers...</div>';

            try {
                const res = await fetch('/api/admin/linkedin-scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ query: company, location: location })
                });

                if (!res.ok) throw new Error(`Server Error: ${res.status}`);
                const response = await res.json();
                
                if(response.data && response.data.length > 0) {
                    currentJobs = response.data;
                    renderResults(currentJobs);
                    toolbar.style.display = 'flex';
                } else {
                    resultsArea.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 40px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,0.02);">
                            <h3 style="color: var(--accent); margin-bottom: 10px;">No Verified Matches Found</h3>
                            <p style="color: var(--text-muted)">Could not find jobs specifically for <b>${company}</b> in <b>${location}</b>.</p>
                        </div>`;
                }

            } catch (err) {
                resultsArea.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; border: 1px solid var(--danger); background: rgba(255,0,0,0.05); border-radius: 12px;">
                        <h3 style="color: var(--danger)"><i class="fas fa-exclamation-triangle"></i> Scan Failed</h3>
                        <p>${err.message}</p>
                    </div>`;
            } finally {
                btn.innerHTML = '<i class="fas fa-search"></i> SCAN JOBS';
                btn.disabled = false;
            }
        }

        // 3. Render Cards to UI
        function renderResults(jobs) {
            const container = document.getElementById('results-area');
            document.getElementById('result-count').innerText = jobs.length;
            document.getElementById('selectAll').checked = false; // Reset toggle
            container.innerHTML = '';

            jobs.forEach((job, index) => {
                const logoHtml = job.logo ? `<img src="${job.logo}" class="company-logo" onerror="this.src='https://logo.clearbit.com/${job.company.replace(/\\s/g,'').toLowerCase()}.com'; this.onerror=null;">` : '';
                
                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <input type="checkbox" class="job-checkbox" id="job-${index}" value="${index}" onchange="toggleCardStyle(this)">
                    
                    <div class="job-header">
                        ${logoHtml}
                        <div>
                            <h3 style="margin: 0; font-family: var(--font-header); font-size: 1.15rem; line-height: 1.3;">${job.title}</h3>
                            <div style="font-size: 0.95rem; color: var(--accent); margin-top: 4px; font-weight: 600;">${job.company}</div>
                        </div>
                    </div>
                    
                    <div style="margin: 8px 0;">
                        <span class="meta-tag"><i class="fas fa-map-marker-alt" style="color: var(--accent);"></i> ${job.location}</span>
                        <span class="meta-tag"><i class="far fa-clock" style="color: var(--success);"></i> ${job.date}</span>
                    </div>

                    <a href="${job.link}" target="_blank" style="margin-top: auto; display: block; text-align:center; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: 0.3s;">
                        VIEW ON LINKEDIN <i class="fas fa-external-link-alt" style="margin-left: 5px;"></i>
                    </a>
                `;
                container.appendChild(card);
            });
        }

        // 4. UI toggles & Highlights
        function toggleCardStyle(checkbox) {
            const card = checkbox.closest('.job-card');
            if (checkbox.checked) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
                document.getElementById('selectAll').checked = false;
            }
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('selectAll').checked;
            const checkboxes = document.querySelectorAll('.job-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = isChecked;
                toggleCardStyle(cb);
            });
        }

// Send Selected to Database
        async function importSelectedJobs() {
            const checkedBoxes = document.querySelectorAll('.job-checkbox:checked');
            if(checkedBoxes.length === 0) return Swal.fire('Notice', 'Please select at least one job to import.', 'info');

            const jobsToImport = Array.from(checkedBoxes).map(cb => currentJobs[cb.value]);
            const btn = document.getElementById('import-btn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Importing...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin/import-jobs-bulk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin', // السطر ده مهم جداً عشان يبعت الـ Token للسيرفر
                    body: JSON.stringify({ jobs: jobsToImport })
                });

                const response = await res.json();
                
                if (res.ok && response.success) {
                    Swal.fire('Completed', response.message, 'success');
                } else {
                    Swal.fire('Error', response.error || 'Access Denied', 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Failed to communicate with server.', 'error');
            } finally {
                btn.innerHTML = '<i class="fas fa-database"></i> Add to Database';
                btn.disabled = false;
            }
        }
    
    </script>
</body>
</html>
