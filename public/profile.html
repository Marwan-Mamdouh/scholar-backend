<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/global.css">
    
    <style>
        .profile-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; color: var(--text-main); }
        
        #loading-overlay { display: flex; justify-content: center; align-items: center; height: 50vh; }
        .spinner { border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .profile-header { display: flex; align-items: center; gap: 30px; background: var(--bg-card); padding: 30px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); flex-wrap: wrap; }
        .avatar-wrapper { position: relative; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); background: var(--bg-main); }
        .btn-avatar-edit { position: absolute; bottom: 5px; right: 5px; background: var(--accent); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: transform 0.2s; display: none; }
        .btn-avatar-edit:hover { transform: scale(1.1); }
        
        .profile-title h2 { margin: 0 0 10px 0; font-size: 2rem; }
        .badge-role { background: rgba(168, 85, 247, 0.15); color: var(--accent); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; letter-spacing: 1px; }
        
        .profile-actions { margin-left: auto; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .btn-edit { background: var(--accent); color: white; }
        .btn-save { background: #10b981; color: white; display: none; }
        .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-main); display: none; }
        .btn:hover { filter: brightness(1.1); }
        .btn-cancel:hover { background: var(--bg-main); }

        .profile-completeness { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 30px; }
        .completeness-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
        .progress-bar { height: 10px; background: var(--bg-main); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #10b981); transition: width 0.5s ease; width: 0%; }

        .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .profile-card { background: var(--bg-card); padding: 25px; border-radius: 16px; border: 1px solid var(--border); }
        .profile-card.full-width { grid-column: span 2; }
        .profile-card h3 { margin-top: 0; margin-bottom: 20px; font-size: 1.2rem; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-muted); }
        .hint { font-size: 0.8rem; color: var(--text-muted); margin: -10px 0 15px 0; display: block; }
        
        input, textarea, select { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); font-family: inherit; transition: 0.3s; box-sizing: border-box; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2); }
        
        input:disabled, textarea:disabled, select:disabled { background: transparent; border-color: transparent; color: var(--text-main); padding-left: 0; opacity: 1; cursor: default; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        .readonly-input:disabled { background: rgba(0,0,0,0.1) !important; border-color: var(--border) !important; padding-left: 14px !important; color: var(--text-muted) !important; }

        @media (max-width: 768px) {
            .profile-header { flex-direction: column; text-align: center; }
            .profile-actions { margin: 15px auto 0; }
            .profile-grid { grid-template-columns: 1fr; }
            .profile-card.full-width { grid-column: span 1; }
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>
    <div id="app-header"></div>

    <main class="profile-container">
        <div id="loading-overlay"><div class="spinner"></div></div>

        <div id="profile-content" style="display: none;">
            
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <img src="https://via.placeholder.com/120" id="user-avatar" class="profile-avatar" alt="Avatar">
                    <button class="btn-avatar-edit" id="btn-avatar-edit" onclick="document.getElementById('avatar-upload').click()">
                        <i class="fas fa-camera"></i>
                    </button>
                    <input type="file" id="avatar-upload" hidden accept="image/*">
                </div>
                
                <div class="profile-title">
                    <h2 id="display-name">Loading...</h2>
                    <span class="badge-role" id="display-role">USER</span>
                </div>
                
                <div class="profile-actions">
                    <button class="btn btn-edit" id="btn-edit" onclick="toggleEdit(true)"><i class="fas fa-pen"></i> Edit Profile</button>
                    <button class="btn btn-cancel" id="btn-cancel" onclick="toggleEdit(false)">Cancel</button>
                    <button class="btn btn-save" id="btn-save" onclick="saveProfile()">Save Changes</button>
                </div>
            </div>

            <div class="profile-completeness">
                <div class="completeness-header">
                    <span>Profile Completeness</span>
                    <span id="completeness-text">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="completeness-bar"></div>
                </div>
            </div>

            <div class="profile-grid">
                <!-- Personal Info -->
                <div class="profile-card">
                    <h3><i class="fas fa-user"></i> Personal Information</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="input-full-name" class="editable" disabled>
                        </div>
                        <div class="form-group">
                            <label>Current Status</label>
                            <select id="input-role" class="editable" disabled>
                                <option value="student">Student</option>
                                <option value="graduate">Graduate</option>
                                <option value="researcher">Researcher</option>
                                <option value="industry">Industry Professional</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email (Read-only)</label>
                        <input type="email" id="input-email" class="readonly-input" disabled>
                    </div>
                    <div class="form-group">
                        <label>Bio / About Me</label>
                        <textarea id="input-bio" class="editable" rows="3" disabled placeholder="Tell us about yourself..."></textarea>
                    </div>
                </div>

                <!-- Academic & Professional -->
                <div class="profile-card">
                    <h3><i class="fas fa-building"></i> Experience & Education</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>University</label>
                            <input type="text" id="input-university" class="editable" disabled>
                        </div>
                        <div class="form-group">
                            <label>Graduation Year</label>
                            <input type="number" id="input-grad-year" class="editable" disabled>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Current Company / Workplace</label>
                            <input type="text" id="input-company" class="editable" disabled placeholder="e.g. Nexus Corp">
                        </div>
                        <div class="form-group">
                            <label>Position</label>
                            <input type="text" id="input-position" class="editable" disabled placeholder="e.g. Software Engineer">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>LinkedIn URL</label>
                            <input type="url" id="input-linkedin" class="editable" disabled placeholder="https://linkedin.com/in/...">
                        </div>
                        <div class="form-group">
                            <label>GitHub URL</label>
                            <input type="url" id="input-github" class="editable" disabled placeholder="https://github.com/...">
                        </div>
                    </div>
                </div>

                <!-- Graduation Project -->
                <div class="profile-card full-width">
                    <h3><i class="fas fa-project-diagram"></i> Graduation Project</h3>
                    
                    <div class="form-group">
                        <label>Project Title</label>
                        <input type="text" id="input-grad-title" class="editable" disabled placeholder="e.g. AI-Powered Smart Campus">
                    </div>
                    
                    <div class="form-group">
                        <label>Project Description</label>
                        <textarea id="input-grad-desc" class="editable" disabled rows="2" placeholder="Briefly describe the objective and technologies used..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Project University</label>
                            <input type="text" id="input-grad-uni" class="editable" disabled placeholder="University where project was done">
                        </div>
                        <div class="form-group">
                            <label>Sponsor / Company Mentor (Optional)</label>
                            <input type="text" id="input-grad-sponsor" class="editable" disabled placeholder="e.g. Microsoft Egypt">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Main Supervisor</label>
                            <input type="text" id="input-grad-sup" class="editable" disabled placeholder="e.g. Dr. Ahmed">
                        </div>
                        <div class="form-group">
                            <label>Co-Supervisor (Optional)</label>
                            <input type="text" id="input-grad-cosup" class="editable" disabled placeholder="e.g. Dr. Sarah">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Document / Thesis Link</label>
                        <input type="url" id="input-grad-link" class="editable" disabled placeholder="Link to Drive, GitHub repo, or published paper">
                    </div>
                </div>

                <!-- Skills -->
                <div class="profile-card full-width">
                    <h3><i class="fas fa-code"></i> Technical Skills</h3>
                    <span class="hint">Separate items with commas (e.g., React, AI, Deep Learning)</span>
                    <div class="form-group">
                        <input type="text" id="input-skills" class="editable" disabled placeholder="e.g. Python, Machine Learning, Data Analysis">
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="app-footer"></div>
    <script src="/js/layout.js"></script>
    
    <script>
        let currentUserData = {};

        document.addEventListener('DOMContentLoaded', async () => {
            await loadProfile();
            
            // Avatar Upload Listener
            document.getElementById('avatar-upload').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('avatar', file);

                try {
                    const res = await fetch('/api/profile/avatar', { method: 'POST', body: formData });
                    const result = await res.json();
                    
                    if (result.success) {
                        document.getElementById('user-avatar').src = result.avatar_url;
                        if(currentUserData.profile) currentUserData.profile.avatar_url = result.avatar_url;
                        updateCompleteness();
                        if (typeof showSuccessToast === 'function') showSuccessToast("Avatar updated!");
                    } else {
                        alert(result.error || "Avatar upload failed");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Network error. Try again.");
                }
            });
        });

        async function loadProfile() {
            try {
                const res = await fetch('/api/profile');
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '/login'; 
                    return;
                }
                
                const result = await res.json();
                if (result.success) {
                    currentUserData = result.data;
                    if(!currentUserData.profile) currentUserData.profile = {}; // Fallback for new users
                    populateData(currentUserData);
                    document.getElementById('loading-overlay').style.display = 'none';
                    document.getElementById('profile-content').style.display = 'block';
                }
            } catch (err) {
                console.error("Failed to load profile", err);
            }
        }

        function populateData(data) {
            const p = data.profile || {};
            
            document.getElementById('display-name').textContent = p.full_name || data.name || 'Anonymous';
            document.getElementById('display-role').textContent = (data.role || 'USER').toUpperCase();
            document.getElementById('user-avatar').src = p.avatar_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(data.name || 'User') + '&background=random';

            document.getElementById('input-full-name').value = p.full_name || data.name || '';
            document.getElementById('input-role').value = (data.role || 'student').toLowerCase();
            document.getElementById('input-email').value = data.email || '';
            document.getElementById('input-bio').value = p.bio || '';
            document.getElementById('input-university').value = p.university || '';
            document.getElementById('input-grad-year').value = p.graduation_year || '';
            document.getElementById('input-linkedin').value = p.linkedin_url || '';
            document.getElementById('input-github').value = p.github_url || '';
            
            
            const exp = Array.isArray(p.experience) && p.experience.length > 0 ? p.experience[0] : {};
            document.getElementById('input-company').value = exp.company || '';
            document.getElementById('input-position').value = exp.position || '';

            
            const gradProj = p.graduation_project || {};
            document.getElementById('input-grad-title').value = gradProj.title || '';
            document.getElementById('input-grad-desc').value = gradProj.description || '';
            document.getElementById('input-grad-uni').value = gradProj.university || '';
            document.getElementById('input-grad-sponsor').value = gradProj.sponsor || '';
            document.getElementById('input-grad-sup').value = gradProj.supervisor || '';
            document.getElementById('input-grad-cosup').value = gradProj.co_supervisor || '';
            document.getElementById('input-grad-link').value = gradProj.doc_link || '';

            
            document.getElementById('input-skills').value = Array.isArray(p.skills) ? p.skills.join(', ') : '';

            updateCompleteness();
        }

        function toggleEdit(isEditing) {
            document.querySelectorAll('.editable').forEach(input => {
                input.disabled = !isEditing;
                if (isEditing) input.style.border = "1px solid var(--border)";
                else input.style.border = "1px solid transparent";
            });

            document.getElementById('btn-edit').style.display = isEditing ? 'none' : 'block';
            document.getElementById('btn-save').style.display = isEditing ? 'block' : 'none';
            document.getElementById('btn-cancel').style.display = isEditing ? 'block' : 'none';
            document.getElementById('btn-avatar-edit').style.display = isEditing ? 'block' : 'none';

            if (!isEditing) populateData(currentUserData); 
        }

        async function saveProfile() {
            const btnSave = document.getElementById('btn-save');
            btnSave.textContent = 'Saving...';
            btnSave.disabled = true;

            const payload = {
                full_name: document.getElementById('input-full-name').value,
                role: document.getElementById('input-role').value,
                bio: document.getElementById('input-bio').value,
                university: document.getElementById('input-university').value,
                graduation_year: document.getElementById('input-grad-year').value,
                linkedin_url: document.getElementById('input-linkedin').value,
                github_url: document.getElementById('input-github').value,
                skills: document.getElementById('input-skills').value,
                
                experience:[{
                    company: document.getElementById('input-company').value,
                    position: document.getElementById('input-position').value
                }],
                
                // Expanded Graduation Project payload
                graduation_project: {
                    title: document.getElementById('input-grad-title').value,
                    description: document.getElementById('input-grad-desc').value,
                    university: document.getElementById('input-grad-uni').value,
                    sponsor: document.getElementById('input-grad-sponsor').value,
                    supervisor: document.getElementById('input-grad-sup').value,
                    co_supervisor: document.getElementById('input-grad-cosup').value,
                    doc_link: document.getElementById('input-grad-link').value
                }
            };

            try {
                const res = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();
                
                if (result.success) {
                    if (typeof showSuccessToast === 'function') showSuccessToast("Profile Updated!");
                    currentUserData.profile = result.data; 
                    currentUserData.name = payload.full_name; 
                    currentUserData.role = payload.role; 
                    
                    // Keep local storage in sync for header name update
                    let localUser = JSON.parse(localStorage.getItem('nexus_user'));
                    if (localUser) {
                        localUser.name = payload.full_name;
                        localUser.role = payload.role;
                        localStorage.setItem('nexus_user', JSON.stringify(localUser));
                    }

                    toggleEdit(false);
                    updateCompleteness();
                } else {
                    alert(result.error || "Update failed.");
                }
            } catch (err) {
                console.error(err);
                alert("Network error. Try again.");
            } finally {
                btnSave.textContent = 'Save Changes';
                btnSave.disabled = false;
            }
        }

        function updateCompleteness() {
            const p = currentUserData.profile || {};
            const fields =[
                p.full_name || currentUserData.name, 
                p.bio, 
                p.university, 
                p.avatar_url,
                (p.skills && p.skills.length > 0) ? p.skills : null,
                p.graduation_project?.title,
                p.graduation_project?.doc_link,
                (p.experience && p.experience.length > 0 && p.experience[0].company) ? p.experience[0].company : null
            ];
            
            const filled = fields.filter(val => val && String(val).trim() !== '').length;
            const percentage = Math.round((filled / fields.length) * 100);

            document.getElementById('completeness-text').textContent = percentage + '%';
            document.getElementById('completeness-bar').style.width = percentage + '%';
        }
    </script>
</body>
</html>
