<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL SCANNER // Scholar Nexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <link rel="stylesheet" href="/css/global.css">
    <!-- Reusing the local-search CSS to ensure an identical, professional UI -->
    <link rel="stylesheet" href="/css/pages/local-search.css">
    
    <style>
        /* Supplementary Styles for Scanner Specifics */
        .scan-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 8px;
            font-family: var(--font-header);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .scan-btn:active {
            transform: translateY(0);
        }

        .ls-card__metrics {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            justify-content: center;
        }

        .ls-metric {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .ls-metric span {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            font-family: var(--font-header);
        }

        .co-author-pill {
            cursor: pointer; 
            display: inline-block; 
            padding: 8px 15px; 
            background: var(--bg-card); 
            border-radius: 20px; 
            margin: 5px; 
            border: 1px solid var(--border);
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .co-author-pill:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            background: var(--bg-hover);
        }

        /* Ensure smooth paper filtering input */
        .ls-paper-filters input { 
            padding: 12px 15px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: var(--bg-input); 
            color: white; 
            font-family: var(--font-main);
            outline: none;
            transition: border-color 0.2s;
        }

        .ls-paper-filters input:focus {
            border-color: var(--accent);
        }
    </style>
</head>

<body>

    <div id="app-header"></div>

    <!-- HERO -->
    <section class="ls-hero" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, rgb(16 185 129 / 0%) 100%);">
        <div class="ls-hero-badge" style="background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3);">GLOBAL SCANNER</div>
        <h1>Researcher Search</h1>
        <p>Dive into a living network of researchers, where collaborations, citations, and ideas connect across borders.</p>
    </section>

    <!-- MAIN CONTAINER -->
    <div class="ls-container">
        <div class="ls-layout">

            <!-- LEFT SIDEBAR -->
            <aside class="ls-sidebar">
                <div class="ls-panel">
                    <div class="ls-panel-title">
                        <span><i class="fas fa-satellite-dish" style="color: var(--accent);"></i> TARGET ACQUISITION</span>
                    </div>

                    <div class="ls-form-group" style="margin-top: 15px;">
                        <label>RESEARCHER NAME</label>
                        <input type="text" id="q" placeholder="e.g. Andrew Ng..." onkeypress="if(event.key==='Enter') executeScan()">
                    </div>

                    <button class="scan-btn" onclick="executeScan()" id="btn-scan">
                        <span>INITIATE SCAN</span> <i class="fas fa-radar"></i>
                    </button>
                </div>
            </aside>

            <!-- RIGHT MAIN AREA -->
            <div class="ls-main" id="ls-main">

                <!-- VIEW 1: RESULTS GRID/LIST -->
                <div id="view-results">
                    <div class="ls-topbar">
                        <div class="ls-topbar__left">
                            <h2 class="ls-topbar__title">Search Results</h2>
                            <span class="ls-topbar__count" id="grid-count">0</span>
                        </div>
                        <div class="ls-topbar__right">
                            <div class="ls-view-toggle">
                                <button class="ls-view-btn vt-active" id="btn-view-grid" onclick="setView('grid')" title="Grid view">
                                    <i class="fas fa-th-large"></i>
                                </button>
                                <button class="ls-view-btn" id="btn-view-list" onclick="setView('list')" title="List view">
                                    <i class="fas fa-list"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Placeholder / Grid Container -->
                    <div class="ls-researcher-grid" id="researcher-grid">
                        <div class="ls-empty" style="grid-column: 1 / -1; padding: 60px 20px;">
                            <div style="background: var(--bg-card); width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                                <i class="fas fa-fingerprint" style="font-size: 3rem; color: var(--accent); opacity: 0.8;"></i>
                            </div>
                            <h3>Awaiting Target</h3>
                            <p style="max-width: 400px; margin: 0 auto;">Enter a researcher's name in the panel on the left to scan the global database.</p>
                        </div>
                    </div>
                </div>

                <!-- VIEW 2: PROFILE (Injected via JS) -->
                <div id="view-profile" style="display:none;"></div>

            </div>

        </div>
    </div>

    <div id="app-footer"></div>

    <script src="/js/layout.js"></script>
    <script>
        // ===========================
        // STATE MANAGEMENT
        // ===========================
        let currentResults =[];
        let currentView = 'grid'; // 'grid' | 'list'
        let currentAuthorPapers =[];
        let personalChartInstance = null;

        // ===========================
        // SCANNER LOGIC
        // ===========================
        async function executeScan() {
            const query = document.getElementById('q').value.trim();
            if (!query) return;

            // Reset UI
            backToResults();
            const btn = document.getElementById('btn-scan');
            const container = document.getElementById('researcher-grid');
            const countBadge = document.getElementById('grid-count');
            
            btn.innerHTML = `<span>SCANNING...</span> <i class="fas fa-spinner fa-spin"></i>`;
            btn.style.opacity = '0.7';
            btn.disabled = true;

            container.className = 'ls-researcher-grid';
            container.innerHTML = `
                <div class="ls-loading" style="grid-column: 1/-1; margin-top: 50px;">
                    <i class="fas fa-circle-notch fa-spin"></i> Extracting global data...
                </div>
            `;

            try {
                // Fetch from S2 via Backend
                const res = await axios.get('/api/search', { params: { query: query, page: 1, limit: 20 } });
                currentResults = res.data.authors ||[];
                
                countBadge.textContent = currentResults.length;
                renderResults(currentResults);
            } catch (e) {
                console.error(e);
                container.innerHTML = `
                    <div class="ls-empty" style="grid-column: 1/-1;">
                        <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                        <h3>Scan Failed</h3>
                        <p>Unable to reach the global database. Try again later.</p>
                    </div>
                `;
            } finally {
                btn.innerHTML = `<span>INITIATE SCAN</span> <i class="fas fa-radar"></i>`;
                btn.style.opacity = '1';
                btn.disabled = false;
            }
        }

        // ===========================
        // RESULTS RENDERING (Grid/List)
        // ===========================
        function setView(v) {
            currentView = v;
            document.getElementById('btn-view-grid').classList.toggle('vt-active', v === 'grid');
            document.getElementById('btn-view-list').classList.toggle('vt-active', v === 'list');
            if (currentResults.length > 0) renderResults(currentResults);
        }

        function renderResults(data) {
            const container = document.getElementById('researcher-grid');

            if (!data || data.length === 0) {
                container.className = 'ls-researcher-grid';
                container.innerHTML = `
                    <div class="ls-empty" style="grid-column: 1/-1;">
                        <i class="fas fa-user-slash"></i>
                        <h3>No matches found</h3>
                        <p>Try adjusting the name or checking for typos.</p>
                    </div>
                `;
                return;
            }

            if (currentView === 'grid') {
                container.className = 'ls-researcher-grid';
                container.innerHTML = data.map(r => renderCard(r)).join('');
            } else {
                container.className = 'ls-researcher-list';
                container.innerHTML = data.map(r => renderRow(r)).join('');
            }
        }

        function renderCard(a) {
            const color = getAvatarColor(a.name);
            const initials = getInitials(a.name);
            const topicClass = getTopicClass(a.primaryField);

            return `
            <div class="ls-card" style="display:flex; flex-direction:column; justify-content:space-between;">
                <div>
                    <div class="ls-card__topic-badge ${topicClass}">
                        ${a.primaryField || 'General Science'}
                    </div>
                    <div class="ls-card__avatar" style="background:${color}">
                        ${initials}
                    </div>
                    <h3 class="ls-card__name" style="margin-bottom: 5px;">${a.name}</h3>
                    <p class="ls-card__affil" style="margin-bottom: 0;">Global Network</p>
                </div>
                
                <div>
                    <div class="ls-card__metrics">
                        <div class="ls-metric"><span>${a.hIndex || 0}</span> H-Index</div>
                        <div class="ls-metric"><span>${a.paperCount || 0}</span> Papers</div>
                        <div class="ls-metric"><span>${formatNumber(a.citationCount || 0)}</span> Citations</div>
                    </div>
                    <button class="ls-card__btn" style="margin-top: 15px;" onclick="analyzeScanner('${a.authorId}')">
                        Analyze Profile →
                    </button>
                </div>
            </div>
            `;
        }

        function renderRow(a) {
            const color = getAvatarColor(a.name);
            const initials = getInitials(a.name);
            const topicClass = getTopicClass(a.primaryField);

            return `
            <div class="ls-row">
                <div class="ls-row__avatar" style="background:${color}">
                    ${initials}
                </div>
                <div class="ls-row__info" style="flex: 1;">
                    <span class="ls-row__name">${a.name}</span>
                    <span class="ls-row__affil">H-Index: ${a.hIndex || 0} &bull; Papers: ${a.paperCount || 0}</span>
                </div>
                <span class="ls-card__topic-badge ${topicClass}" style="position:static; margin-right: 20px;">
                    ${a.primaryField || 'General'}
                </span>
                <button class="ls-row__btn" onclick="analyzeScanner('${a.authorId}')">
                    Analyze Profile
                </button>
            </div>
            `;
        }

        // ===========================
        // VIEW SWITCHING
        // ===========================
        function backToResults() {
            document.getElementById('view-results').style.display = 'block';
            document.getElementById('view-profile').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===========================
        // ANALYZE PROFILE
        // ===========================
        async function analyzeScanner(authorId) {
            document.getElementById('view-results').style.display = 'none';
            const profileDiv = document.getElementById('view-profile');
            profileDiv.style.display = 'block';
            
            profileDiv.innerHTML = `
                <div class="ls-loading" style="margin-top:100px;">
                    <i class="fas fa-circle-notch fa-spin" style="font-size:3rem; color:var(--success);"></i>
                    <span style="display:block; margin-top:15px; font-size:1.2rem;">Generating Deep Analysis...</span>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                const res = await axios.post('/api/analyze', { authorId });
                renderProfile(res.data);
            } catch(e) {
                console.error(e);
                profileDiv.innerHTML = `
                    <button class="ls-profile-back" onclick="backToResults()"><i class="fas fa-arrow-left"></i> Back to results</button>
                    <div class="ls-empty-state" style="margin-top:50px;">
                        <i class="fas fa-exclamation-triangle" style="font-size:3rem; color:var(--danger); margin-bottom:15px;"></i>
                        <h2>Analysis Failed</h2>
                        <p>Semantic Scholar API might be rate-limited. Please try again in a moment.</p>
                    </div>`;
            }
        }

        // ===========================
        // PROFILE RENDERING
        // ===========================
        function renderProfile(data) {
            const { local, author, collaborators } = data;
            const cleanUni = local.affiliation || "Global Academic Network";
            currentAuthorPapers = author ? author.papers :[];
            const initials = getInitials(local.name);
            const avatarColor = getAvatarColor(local.name);
            const badgeClass = getTopicClass(local.main_topic);

            const gsLink = local.scholar_id && !local.scholar_id.match(/^\d+$/)
                ? `https://scholar.google.com/citations?user=${local.scholar_id}`
                : null;

            // Co-authors HTML
            const collabHtml = (collaborators && collaborators.length) ? collaborators.map(c => {
                const clickAction = `onclick="window.open('https://www.semanticscholar.org/author/${c.id}', '_blank')"`;
                return `
                    <div class="co-author-pill" ${clickAction} title="Open Semantic Scholar profile">
                        <i class="fas fa-external-link-alt" style="font-size:0.8rem; color:var(--accent); margin-right:5px;"></i>
                        ${c.name}
                        <span style="opacity:0.5; margin-left:5px; font-size:0.8rem;">(${c.count} papers)</span>
                    </div>
                `;
            }).join('') : '<div class="ls-empty-state" style="padding:20px;"><p>No co-author data available.</p></div>';

            const profileDiv = document.getElementById('view-profile');
            profileDiv.innerHTML = `
                <button class="ls-profile-back" onclick="backToResults()"><i class="fas fa-arrow-left"></i> Back to results</button>

                <div class="ls-profile-header">
                    <div class="ls-profile-top">
                        <div class="ls-profile-identity">
                            <div class="ls-profile-avatar" style="background:${avatarColor};">${initials}</div>
                            <div>
                                <h1 class="ls-profile-name">${local.name}</h1>
                                <div class="ls-profile-affiliation"><i class="fas fa-globe-americas"></i> ${cleanUni}</div>
                                <div class="ls-profile-tags">
                                    ${local.main_topic ? `<span class="field-badge ${badgeClass}">${local.main_topic}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="ls-profile-actions">
                            ${gsLink ? `<a href="${gsLink}" target="_blank" class="ls-action-btn ls-scholar"><i class="fas fa-graduation-cap"></i> Google Scholar</a>` : ''}
                            ${author && author.url ? `<a href="${author.url}" target="_blank" class="ls-action-btn ls-semantic"><i class="fas fa-book-reader"></i> Semantic Scholar</a>` : ''}
                        </div>
                    </div>

                    <div class="ls-profile-stats">
                        <div class="ls-stat-box">
                            <div class="ls-stat-value ls-hindex">${author ? author.hIndex : '0'}</div>
                            <div class="ls-stat-label-text">H-Index</div>
                        </div>
                        <div class="ls-stat-box">
                            <div class="ls-stat-value ls-papers">${author ? author.paperCount : '0'}</div>
                            <div class="ls-stat-label-text">Papers</div>
                        </div>
                        <div class="ls-stat-box">
                            <div class="ls-stat-value ls-citations">${author ? formatNumber(author.citationCount) : '0'}</div>
                            <div class="ls-stat-label-text">Total Citations</div>
                        </div>
                    </div>
                </div>

                <!-- TABS -->
                <div class="network-tabs">
                    <button class="net-tab active" onclick="switchProfileTab('papers', this)"><i class="fas fa-scroll"></i> Publications</button>
                    <button class="net-tab" onclick="switchProfileTab('coauthors', this)"><i class="fas fa-project-diagram"></i> Network</button>
                    <button class="net-tab" onclick="switchProfileTab('analytics', this)"><i class="fas fa-chart-pie"></i> Analytics</button>
                </div>

                <!-- Tab: Papers -->
                <div class="ls-tab-content active" id="tab-papers">
                    <div class="ls-paper-filters" style="display:flex; gap:10px; margin-bottom:20px;">
                        <input type="text" id="paper-search" placeholder="Search publication titles..." oninput="filterPapers()" style="flex:1;">
                        <input type="number" id="paper-year" placeholder="Year" style="width:120px;" oninput="filterPapers()">
                    </div>
                    <div class="ls-papers-scroll" id="paper-list-container" style="max-height: 600px; overflow-y: auto; padding-right: 10px;"></div>
                </div>

                <!-- Tab: Co-Authors -->
                <div class="ls-tab-content" id="tab-coauthors">
                    <div class="ls-coauthors-wrap" style="padding: 10px 0;">${collabHtml}</div>
                </div>

                <!-- Tab: Analytics -->
                <div class="ls-tab-content" id="tab-analytics">
                    <div class="personal-dash-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px;">
                        <div class="ls-analytics-card" style="background:var(--bg-card); padding:25px; border-radius:12px; border:1px solid var(--border);">
                            <h4 style="margin-bottom: 20px; color: var(--text-main);"><i class="fas fa-bullseye" style="color:var(--accent)"></i> Knowledge Domains</h4>
                            <div class="chart-container" style="height:250px; position:relative;"><canvas id="chart-personal-fields"></canvas></div>
                        </div>
                        <div class="ls-analytics-card" style="background:var(--bg-card); border-radius:12px; border:1px solid var(--border); display:flex; flex-direction:column;">
                            <h4 style="padding: 20px 20px 0; margin: 0; color: var(--text-main);"><i class="fas fa-bolt" style="color:var(--warning)"></i> Impact Summary</h4>
                            <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
                                <div style="text-align:center; padding:15px;">
                                    <div class="stat-number" style="font-size:2.5rem; color: var(--text-main);">${author ? author.hIndex : '0'}</div>
                                    <div class="stat-label">H-Index Score</div>
                                </div>
                                <div style="display:flex; border-top:1px solid var(--border);">
                                    <div style="flex:1; text-align:center; padding:20px; border-right:1px solid var(--border);">
                                        <div class="stat-number" style="color:#10b981; font-size:1.8rem;">${author ? formatNumber(author.citationCount) : '0'}</div>
                                        <div class="stat-label">Citations</div>
                                    </div>
                                    <div style="flex:1; text-align:center; padding:20px;">
                                        <div class="stat-number" style="color:#a855f7; font-size:1.8rem;">${author ? author.paperCount : '0'}</div>
                                        <div class="stat-label">Total Papers</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            renderPersonalChart(author);
            filterPapers();
        }

        function switchProfileTab(tabName, btn) {
            document.querySelectorAll('.net-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.ls-tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // ===========================
        // PAPER FILTERING
        // ===========================
        function filterPapers() {
            const searchEl = document.getElementById('paper-search');
            const yearEl = document.getElementById('paper-year');
            if (!searchEl || !yearEl || !currentAuthorPapers) return;

            const q = searchEl.value.toLowerCase();
            const y = yearEl.value;
            const container = document.getElementById('paper-list-container');

            const filtered = currentAuthorPapers.filter(p => {
                const matchQ = !q || (p.title && p.title.toLowerCase().includes(q));
                const matchY = !y || (p.year && p.year == y);
                return matchQ && matchY;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="ls-empty-state" style="padding:40px 20px; text-align:center; background: var(--bg-card); border-radius: 8px; border: 1px dashed var(--border);">
                        <i class="fas fa-search-minus" style="font-size: 2rem; color: var(--text-muted); margin-bottom: 10px;"></i>
                        <p style="color:var(--text-muted); margin:0;">No papers match your search criteria.</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(p => {
                const hasPdf = p.openAccessPdf && p.openAccessPdf.url;
                return `
                <div class="paper-row">
                    <div class="ls-paper-year">${p.year || '-'}</div>
                    <div class="ls-paper-content">
                        <a href="${p.url}" target="_blank" class="paper-title">${p.title}</a>
                        <div class="paper-meta">
                            <span class="ls-meta-badge"><i class="fas fa-book"></i> ${p.venue || 'Journal / Pre-print'}</span>
                            <span class="ls-meta-badge" style="color:var(--success)"><i class="fas fa-quote-right"></i> ${formatNumber(p.citationCount || 0)}</span>
                            ${hasPdf ? `<a href="${p.openAccessPdf.url}" target="_blank" class="ls-pdf-btn"><i class="fas fa-file-pdf"></i> PDF</a>` : ''}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // ===========================
        // CHARTS & UTILS
        // ===========================
        function renderPersonalChart(author) {
            if (!author || !author.papers) return;

            const counts = {};
            author.papers.forEach(p => {
                if (p.fieldsOfStudy) p.fieldsOfStudy.forEach(f => counts[f] = (counts[f] || 0) + 1);
            });

            const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6);
            if (sorted.length === 0) return; // No data to chart

            const ctx = document.getElementById('chart-personal-fields');
            if (!ctx) return;
            
            if (personalChartInstance) personalChartInstance.destroy();

            personalChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: sorted.map(x => x[0]),
                    datasets:[{
                        data: sorted.map(x => x[1]),
                        backgroundColor:['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#a855f7', '#ec4899'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: { position: 'right', labels: { color: '#94a3b8', padding: 15, font: { family: 'Inter', size: 12 } } },
                        tooltip: { backgroundColor: 'rgba(15,23,42,0.9)', padding: 10, cornerRadius: 8 }
                    },
                    cutout: '70%'
                }
            });
        }

        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(/\s+/);
            if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            return parts[0][0].toUpperCase();
        }

        function getAvatarColor(name) {
            if (!name) return '#3b82f6';
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash % 360)}, 65%, 45%)`;
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

        function getTopicClass(topic) {
            if (!topic) return 'ls-topic--default';
            const t = topic.toLowerCase();
            if (t.includes('ai') || t.includes('machine') || t.includes('learning') || t.includes('deep') || t.includes('intelligent')) return 'ls-topic--green';
            if (t.includes('vlsi') || t.includes('hardware') || t.includes('embedded') || t.includes('circuit') || t.includes('electronic')) return 'ls-topic--blue';
            if (t.includes('software') || t.includes('programming') || t.includes('web') || t.includes('computing')) return 'ls-topic--purple';
            if (t.includes('bio') || t.includes('medical') || t.includes('health')) return 'ls-topic--pink';
            if (t.includes('network') || t.includes('security') || t.includes('cyber')) return 'ls-topic--orange';
            return 'ls-topic--default';
        }
    </script>
</body>
